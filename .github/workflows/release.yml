name: Plan Forge Flow release

on:
  push:
    tags:
      - 'plan-forge-flow-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: plugins/plan-forge-flow
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      # Before the build, not after: a tag that disagrees with the manifest should cost seconds
      # rather than a full publish, and the release it would cut is named after the tag while the
      # asset inside is named after the manifest.
      - name: Check the tag against the manifest
        shell: pwsh
        run: |
          $version = (Get-Content .codex-plugin/plugin.json -Raw | ConvertFrom-Json).version
          $tag = '${{ github.ref_name }}'
          if ($tag -ne "plan-forge-flow-v$version") {
            throw "Tag $tag disagrees with manifest version $version; expected plan-forge-flow-v$version"
          }
          "PLUGIN_VERSION=$version" >> $env:GITHUB_ENV
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build win-x64 local-marketplace bundle
        shell: pwsh
        run: ./build/package.ps1 -OutputRoot "$env:GITHUB_WORKSPACE/release-artifacts"
      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $expected = "plan-forge-flow-$env:PLUGIN_VERSION-win-x64.zip"
          $assets = Get-ChildItem "$env:GITHUB_WORKSPACE/release-artifacts" -Filter '*.zip' -File
          if ($assets.Count -ne 1 -or $assets[0].Name -ne $expected) {
            throw "Expected only $expected"
          }
          gh release create $tag $assets.FullName --title "Plan Forge Flow $tag" --generate-notes
