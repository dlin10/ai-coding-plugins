name: Build Roslyn MCP extension

# See the note in build-plan-forge-flow.yml: without `branches`, a tag push runs this again on
# an already-checked commit, and the `paths` filter below does not hold it back on a tag.
on:
  push:
    branches:
      - main
    paths:
      - 'plugins/roslyn-mcp/extension/**'
      - 'plugins/roslyn-mcp/assets/**'
      - 'plugins/roslyn-mcp/bin/**'
      - 'plugins/roslyn-mcp/scripts/test-published-shim.ps1'
      - '.github/workflows/build-roslyn-mcp.yml'
  pull_request:
    paths:
      - 'plugins/roslyn-mcp/extension/**'
      - 'plugins/roslyn-mcp/assets/**'
      - 'plugins/roslyn-mcp/bin/**'
      - 'plugins/roslyn-mcp/scripts/test-published-shim.ps1'
      - '.github/workflows/build-roslyn-mcp.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: microsoft/setup-msbuild@v3
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Build Release VSIX
        run: msbuild plugins/roslyn-mcp/extension/src/RoslynMcpExtension.slnx /p:Configuration=Release /t:Rebuild /restore
      # The integration tests start real daemons and need an installed SDK older than the newest; they run locally.
      - name: Test headless daemon
        run: dotnet test plugins/roslyn-mcp/extension/src/RoslynMcpExtension.Cli.Tests/RoslynMcpExtension.Cli.Tests.csproj --configuration Release --no-build --no-restore --filter "Category!=Integration"
      # What the release workflow publishes once this reaches main, so that a broken asset fails here first.
      - name: Publish the shim and load a solution through the launcher
        shell: pwsh
        run: |
          dotnet publish plugins/roslyn-mcp/extension/src/RoslynMcpExtension.Cli/RoslynMcpExtension.Cli.csproj --configuration Release --runtime win-x64 --output publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./plugins/roslyn-mcp/scripts/test-published-shim.ps1 -Executable publish/roslyn-mcp.exe
      - name: Audit the shim's packages
        shell: pwsh
        run: |
          $project = 'plugins/roslyn-mcp/extension/src/RoslynMcpExtension.Cli/RoslynMcpExtension.Cli.csproj'
          $output = dotnet list $project package --vulnerable --include-transitive
          $output | Write-Host
          if ($output -match 'has the following vulnerable packages') { exit 1 }
      - name: Verify bundled VSIX version
        shell: pwsh
        run: |
          # The manifest's Identity Version is a build token; the version itself is written in Directory.Build.props.
          $sourcePath = 'plugins/roslyn-mcp/extension/src/Directory.Build.props'
          $vsixPath = 'plugins/roslyn-mcp/assets/RoslynMcpExtension.vsix'
          [xml] $source = Get-Content -Raw $sourcePath
          $sourceVersion = $source.SelectSingleNode('//Version').InnerText
          # A preview ships roslyn-mcp.exe only and keeps the last release's VSIX (plugins/roslyn-mcp/AGENTS.md).
          if ($sourceVersion.Contains('-')) {
            Write-Host "$sourceVersion is a preview; the bundled VSIX stays the last release's."
            exit 0
          }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($vsixPath)
          try {
            $entry = $archive.Entries | Where-Object FullName -eq 'extension.vsixmanifest'
            if ($null -eq $entry) { throw 'Bundled VSIX has no extension.vsixmanifest.' }
            $reader = [System.IO.StreamReader]::new($entry.Open())
            try { [xml] $bundled = $reader.ReadToEnd() } finally { $reader.Dispose() }
          }
          finally { $archive.Dispose() }
          $bundledVersion = $bundled.SelectSingleNode("//*[local-name()='Identity']").Version
          if ($sourceVersion -ne $bundledVersion) {
            throw "Bundled VSIX is $bundledVersion but source is $sourceVersion."
          }
