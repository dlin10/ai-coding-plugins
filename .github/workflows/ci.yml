name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: plugins/plan-forge-flow
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore src/PlanForgeFlow.sln
      - run: dotnet build src/PlanForgeFlow.sln --configuration Release --no-restore
      - run: dotnet test src/PlanForgeFlow.sln --configuration Release --no-build --no-restore
      - name: Verify exactly two solution projects
        shell: pwsh
        run: |
          $projects = @(dotnet sln src/PlanForgeFlow.sln list | Where-Object { $_ -match '\.csproj$' })
          if ($projects.Count -ne 2) { throw "Expected exactly two projects, found $($projects.Count)" }
          if (-not ($projects -match 'PlanForgeFlow.Cli.csproj')) { throw 'CLI project missing' }
          if (-not ($projects -match 'PlanForgeFlow.Cli.Tests.csproj')) { throw 'test project missing' }

  publish:
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        working-directory: plugins/plan-forge-flow
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish and package win-x64
        shell: pwsh
        run: ./build/package.ps1 -OutputRoot "$env:GITHUB_WORKSPACE/artifacts/win-x64"
      - name: Check archive exists
        shell: pwsh
        run: |
          $archive = @(Get-ChildItem "$env:GITHUB_WORKSPACE/artifacts/win-x64" -Filter '*.zip' -File)
          if ($archive.Count -ne 1 -or $archive[0].Name -ne 'plan-forge-flow-0.7.0-win-x64.zip') { throw 'Expected exactly the win-x64 archive' }

  native-smoke:
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        working-directory: plugins/plan-forge-flow
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build host bundle
        shell: pwsh
        run: ./build/package.ps1 -OutputRoot "$env:GITHUB_WORKSPACE/smoke-artifacts"
      - name: Run cold direct executable smoke
        shell: pwsh
        run: |
          $zip = Get-ChildItem "$env:GITHUB_WORKSPACE/smoke-artifacts" -Filter '*.zip' -File | Select-Object -First 1
          $extract = Join-Path $env:RUNNER_TEMP 'planforge-smoke'
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $extract -Force
          $exe = Join-Path $extract 'plugins/plan-forge-flow/bin/win-x64/planforge.exe'
          $env:DOTNET_BUNDLE_EXTRACT_BASE_DIR = Join-Path $env:RUNNER_TEMP 'planforge-bundle-extract'
          $timer = [Diagnostics.Stopwatch]::StartNew()
          & $exe --help | Out-Null
          $code = $LASTEXITCODE
          $timer.Stop()
          if ($code -ne 0 -or $timer.Elapsed.TotalSeconds -ge 10) { throw "native smoke failed: exit=$code elapsed=$($timer.Elapsed.TotalSeconds)" }
