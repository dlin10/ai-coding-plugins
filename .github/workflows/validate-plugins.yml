name: Validate plugin marketplaces

# See the note in build-plan-forge-flow.yml: without `branches`, a tag push runs this again on
# an already-checked commit, and the `paths` filter below does not hold it back on a tag.
on:
  push:
    branches:
      - main
    paths:
      - '.agents/plugins/**'
      - '.claude-plugin/**'
      - '.cursor-plugin/**'
      - 'plugins/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/validate-plugins.yml'
  pull_request:
    paths:
      - '.agents/plugins/**'
      - '.claude-plugin/**'
      - '.cursor-plugin/**'
      - 'plugins/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/validate-plugins.yml'

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run validate:plugins
      - run: npm run test:roslyn-hooks
