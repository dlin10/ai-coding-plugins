name: Build Plan Forge Flow

# A branch push and its pull request are the same commit, and an unfiltered `push` matches every
# ref — tags included, which re-ran this whole suite on a commit `main` had just tested. Restricting
# push to the default branch leaves each commit checked once: on its pull request, then on the merge.
#
# Both jobs below build and package one plugin, so `paths` holds them to it: a README edit or a
# change under another plugin has nothing here to check. The filter is complete because nothing
# outside the plugin feeds the build — global.json and Directory.Build.props live inside it, not at
# the repository root. Adding required status checks would break this: a filtered workflow never
# reports, and a required check that never reports blocks the merge forever.
on:
  push:
    branches:
      - main
      # DIAGNOSTIC: lets a push of this branch run the suite without a pull request.
      - ci/diagnose-plan-forge-test-timing
    paths:
      - 'plugins/plan-forge-flow/**'
      - '.github/workflows/build-plan-forge-flow.yml'
  pull_request:
    paths:
      - 'plugins/plan-forge-flow/**'
      - '.github/workflows/build-plan-forge-flow.yml'

jobs:
  # The suite is CPU-bound and a runner has two physical cores, so it is split by test class over
  # three runners. build/test-shards.json balances the classes by their measured time; the last shard
  # takes whatever the file does not name.
  test:
    name: test (shard ${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: windows-latest
    defaults:
      run:
        working-directory: plugins/plan-forge-flow
    steps:
      - uses: actions/checkout@v7
      # DIAGNOSTIC: pinned to the SDK preinstalled on the image. `10.0.x` resolved to 10.0.403, which
      # the image lacks, and its download from dotnetorigin.blob.core.windows.net answered HTTP 409.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.402
      # DIAGNOSTIC (branch ci/diagnose-plan-forge-test-timing, not for main): what the runner is.
      - name: Runner hardware
        shell: pwsh
        run: |
          Get-CimInstance Win32_Processor | Select-Object Name, NumberOfCores, NumberOfLogicalProcessors, MaxClockSpeed | Format-List
          Get-CimInstance Win32_OperatingSystem | Select-Object @{n='FreeGB';e={[math]::Round($_.FreePhysicalMemory/1MB,1)}}, @{n='TotalGB';e={[math]::Round($_.TotalVisibleMemorySize/1MB,1)}} | Format-List
          Get-MpComputerStatus | Select-Object RealTimeProtectionEnabled, AntivirusEnabled | Format-List
          Get-PSDrive -PSProvider FileSystem | Format-Table Name, @{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}}
          # GIT_TRACE below appends to a file in here; git does not create the directory.
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/diag" | Out-Null
      - run: dotnet restore src/PlanForgeFlow.sln
      - run: dotnet build src/PlanForgeFlow.sln --configuration Release --no-restore
      # Integration tests drive the real vendor CLIs, none of which exist on a runner.
      # DIAGNOSTIC: per-test timings (trx) and every git process the suite starts (GIT_TRACE).
      - name: Test shard ${{ matrix.shard }}
        shell: pwsh
        run: |
          $filter = ./build/test-filter.ps1 -Shard ${{ matrix.shard }}
          Write-Host "filter: $filter"
          dotnet test src/PlanForgeFlow.sln --configuration Release --no-build --no-restore --filter $filter --logger "trx;LogFileName=shard-${{ matrix.shard }}.trx" --results-directory "${{ runner.temp }}/diag"
        env:
          GIT_TRACE: ${{ runner.temp }}\diag\git-trace.log
      - name: Upload test timings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-timings-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/diag
          if-no-files-found: warn
      - name: Verify exactly two solution projects
        shell: pwsh
        run: |
          $projects = @(dotnet sln src/PlanForgeFlow.sln list | Where-Object { $_ -match '\.csproj$' })
          if ($projects.Count -ne 2) { throw "Expected exactly two projects, found $($projects.Count)" }
          if (-not ($projects -match 'PlanForge.csproj')) { throw 'server project missing' }
          if (-not ($projects -match 'PlanForge.Tests.csproj')) { throw 'test project missing' }

  publish:
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        working-directory: plugins/plan-forge-flow
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.402
      - name: Publish and package win-x64
        shell: pwsh
        run: ./build/package.ps1 -OutputRoot "$env:GITHUB_WORKSPACE/artifacts/win-x64"
      - name: Check archive exists
        shell: pwsh
        run: |
          # Read, never spelled out: package.ps1 names the archive after the manifest version, so a
          # literal here turns every version bump into a red build one commit later.
          $expected = "plan-forge-flow-$((Get-Content .codex-plugin/plugin.json -Raw | ConvertFrom-Json).version)-win-x64.zip"
          $archive = @(Get-ChildItem "$env:GITHUB_WORKSPACE/artifacts/win-x64" -Filter '*.zip' -File)
          if ($archive.Count -ne 1 -or $archive[0].Name -ne $expected) { throw "Expected exactly $expected" }
