<svg xmlns="http://www.w3.org/2000/svg"
     width="760"
     height="950"
     viewBox="0 0 760 950"
     role="img"
     aria-labelledby="title description">
  <title id="title">Plan Forge Flow workflow</title>
  <desc id="description">
    A top-to-bottom workflow from opening a run through the interview, round-by-round
    plan review, approval, task-by-task building, and final code review. Plan review
    loops back to the orchestrator, which revises the plan; building repeats once per
    task; code review loops internally between critic and builder.
  </desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="arrowhead" d="M 0 0 L 10 5 L 0 10 z"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="4"
                    flood-color="#1f2328" flood-opacity="0.14"/>
    </filter>
  </defs>

  <style>
    .canvas { fill: #ffffff; }
    .title { fill: #1f2328; font: 700 24px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .node-title { fill: #1f2328; font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .node-detail { fill: #57606a; font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .edge-label { fill: #57606a; font: 600 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0.04em; }
    .node { stroke-width: 2; filter: url(#shadow); }
    .phase { fill: #ddf4ff; stroke: #0969da; }
    .plan { fill: #fbefff; stroke: #8250df; }
    .review { fill: #fff1e5; stroke: #bc4c00; }
    .gate { fill: #fff8c5; stroke: #9a6700; }
    .build { fill: #dafbe1; stroke: #1a7f37; }
    .code-review { fill: #ffeff7; stroke: #bf3989; }
    .done { fill: #dafbe1; stroke: #1a7f37; }
    .risk { fill: #ffebe9; stroke: #cf222e; }
    .edge { fill: none; stroke: #57606a; stroke-width: 2.5; marker-end: url(#arrow); }
    .loop { fill: none; stroke: #8c959f; stroke-width: 2.25; stroke-dasharray: 7 5; marker-end: url(#arrow); }
    .arrowhead { fill: #57606a; }
  </style>

  <rect class="canvas" width="760" height="950"/>
  <text class="title" x="380" y="46" text-anchor="middle">Plan Forge Flow</text>

  <rect class="node phase" x="170" y="80" width="420" height="84" rx="14"/>
  <text class="node-title" x="380" y="114" text-anchor="middle">forge.begin</text>
  <text class="node-detail" x="380" y="140" text-anchor="middle">Run id, capability profile, working-tree baseline</text>

  <rect class="node plan" x="170" y="200" width="420" height="84" rx="14"/>
  <text class="node-title" x="380" y="234" text-anchor="middle">Act 1 — the interview</text>
  <text class="node-detail" x="380" y="260" text-anchor="middle">The orchestrator grills, then writes the plan draft</text>

  <rect class="node review" x="170" y="320" width="420" height="84" rx="14"/>
  <text class="node-title" x="380" y="354" text-anchor="middle">Act 2 — forge.plan.review</text>
  <text class="node-detail" x="380" y="380" text-anchor="middle">One round: a fresh critic judges the draft</text>

  <rect class="node gate" x="170" y="440" width="420" height="84" rx="14"/>
  <text class="node-title" x="380" y="474" text-anchor="middle">forge.plan.confirm</text>
  <text class="node-detail" x="380" y="500" text-anchor="middle">The orchestrator shows the plan and drift, records the answer</text>

  <rect class="node build" x="170" y="560" width="420" height="84" rx="14"/>
  <text class="node-title" x="380" y="594" text-anchor="middle">Act 3 — forge.build.next</text>
  <text class="node-detail" x="380" y="620" text-anchor="middle">One task per call, by a builder that keeps its session</text>

  <rect class="node code-review" x="170" y="680" width="420" height="84" rx="14"/>
  <text class="node-title" x="380" y="714" text-anchor="middle">Act 4 — forge.review.code</text>
  <text class="node-detail" x="380" y="740" text-anchor="middle">Critic to builder and back, the whole loop inside one call</text>

  <rect class="node done" x="100" y="820" width="250" height="84" rx="14"/>
  <text class="node-title" x="225" y="854" text-anchor="middle">Done</text>
  <text class="node-detail" x="225" y="880" text-anchor="middle">Verdict: approve</text>

  <rect class="node risk" x="410" y="820" width="250" height="84" rx="14"/>
  <text class="node-title" x="535" y="854" text-anchor="middle">Cap reached</text>
  <text class="node-detail" x="535" y="880" text-anchor="middle">The user accepts or stops</text>

  <path class="edge" d="M 380 164 L 380 198"/>
  <path class="edge" d="M 380 284 L 380 318"/>
  <path class="edge" d="M 380 404 L 380 438"/>
  <path class="edge" d="M 380 524 L 380 558"/>
  <path class="edge" d="M 380 644 L 380 678"/>
  <path class="edge" d="M 380 764 L 380 792 L 225 792 L 225 818"/>
  <path class="edge" d="M 380 764 L 380 792 L 535 792 L 535 818"/>

  <path class="loop" d="M 590 362 L 650 362 L 650 242 L 592 242"/>
  <text class="edge-label" x="658" y="306">REVISE</text>

  <path class="loop" d="M 170 628 L 104 628 L 104 578 L 168 578"/>
  <text class="edge-label" x="96" y="607" text-anchor="end">NEXT TASK</text>

  <text class="edge-label" x="392" y="546">APPROVED</text>
</svg>
